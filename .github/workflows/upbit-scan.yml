name: Upbit full scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scanner.py
      - extended_scans.py
      - microstructure.py
      - surge_learning.py
      - learning_engine.py
      - scan_roles.json
      - tests/test_learning_engine.py
      - .github/workflows/upbit-scan.yml
  schedule:
    - cron: '10,40 * * * *'
permissions:
  contents: write
concurrency:
  group: upbit-full-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set shared scan cycle
        shell: bash
        run: |
          NOW_EPOCH=$(date -u +%s)
          HOUR_EPOCH=$(( (NOW_EPOCH / 3600) * 3600 ))
          MINUTE_IN_HOUR=$(( (NOW_EPOCH - HOUR_EPOCH) / 60 ))
          if [ "$MINUTE_IN_HOUR" -ge 40 ]; then
            CYCLE_EPOCH=$(( HOUR_EPOCH + 40 * 60 ))
          elif [ "$MINUTE_IN_HOUR" -ge 10 ]; then
            CYCLE_EPOCH=$(( HOUR_EPOCH + 10 * 60 ))
          else
            CYCLE_EPOCH=$(( HOUR_EPOCH - 20 * 60 ))
          fi
          SCAN_CYCLE=$(date -u -d "@$CYCLE_EPOCH" '+%Y-%m-%dT%H:%M:00Z')
          echo "SCAN_CYCLE=$SCAN_CYCLE" >> "$GITHUB_ENV"
          echo "SCAN_RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Verify learning engine invariants
        run: python -m unittest discover -s tests -v
      - name: Fetch and analyze all KRW markets
        run: python scanner.py
      - name: Run v4 and v5 extended scans
        run: python extended_scans.py
      - name: Collect trades, orderbooks, and intraday path
        run: python microstructure.py
      - name: Stamp shared cycle metadata
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          data = Path('data')
          cycle = os.environ['SCAN_CYCLE']
          run_id = os.environ['SCAN_RUN_ID']
          stamped_at = datetime.now(timezone.utc).isoformat()

          for name in ('latest_scan.json', 'latest_extended_summary.json', 'latest_microstructure.json'):
              path = data / name
              if not path.exists():
                  continue
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if isinstance(obj, dict):
                  obj['scan_cycle'] = cycle
                  obj['scan_run_id'] = run_id
                  obj['cycle_stamped_at_utc'] = stamped_at
                  path.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')

          for name in ('latest_scan.csv', 'latest_dual_scan_v5.csv', 'latest_microstructure.csv'):
              path = data / name
              if not path.exists() or path.stat().st_size == 0:
                  continue
              encoding = 'utf-8-sig'
              with path.open(encoding=encoding, newline='') as f:
                  rows = list(csv.DictReader(f))
              if not rows:
                  continue
              fields = list(rows[0].keys())
              for field in ('scan_cycle', 'scan_run_id'):
                  if field not in fields:
                      fields.append(field)
              for row in rows:
                  row['scan_cycle'] = cycle
                  row['scan_run_id'] = run_id
              with path.open('w', encoding=encoding, newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader(); w.writerows(rows)
          PY
      - name: Record new +10% surge learning cases
        run: python surge_learning.py
      - name: Update closed-loop learning and intraday transitions
        run: python learning_engine.py
      - name: Save completed cycle snapshot
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os, shutil
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          data = Path('data')
          cycle = os.environ['SCAN_CYCLE']
          run_id = os.environ['SCAN_RUN_ID']
          kst = timezone(timedelta(hours=9))
          MIN_TRADE_COVERAGE = 0.95

          def read_csv(name, encoding='utf-8-sig'):
              path = data / name
              if not path.exists() or path.stat().st_size == 0:
                  raise RuntimeError(f'missing or empty: {name}')
              with path.open(encoding=encoding, newline='') as f:
                  rows = list(csv.DictReader(f))
              for row in rows:
                  if '\ufeffmarket' in row and 'market' not in row:
                      row['market'] = row.pop('\ufeffmarket')
              return rows

          base = read_csv('latest_scan.csv')
          v5 = read_csv('latest_dual_scan_v5.csv')
          micro = read_csv('latest_microstructure.csv')

          base_markets = {r.get('market') for r in base if r.get('market')}
          micro_markets = {r.get('market') for r in micro if r.get('market')}
          if not base_markets or base_markets != micro_markets:
              raise RuntimeError(f'incomplete cycle: base={len(base_markets)} micro={len(micro_markets)}')

          for rows, label in ((base, 'base'), (v5, 'v5'), (micro, 'micro')):
              bad = [r for r in rows if r.get('scan_cycle') != cycle or r.get('scan_run_id') != run_id]
              if bad:
                  raise RuntimeError(f'{label} metadata mismatch: {len(bad)} rows')

          coverage = [r.get('trade_coverage_15m') for r in micro if 'trade_coverage_15m' in r]
          partial_count = sum(v not in (None, '', 'complete') for v in coverage)
          coverage_count = len(coverage)
          complete_count = coverage_count - partial_count
          coverage_ratio = (complete_count / coverage_count) if coverage_count else 1.0
          if coverage and coverage_ratio < MIN_TRADE_COVERAGE:
              raise RuntimeError(
                  f'trade coverage below threshold: {complete_count}/{coverage_count} '
                  f'({coverage_ratio:.2%}) < {MIN_TRADE_COVERAGE:.0%}'
              )

          cycle_dt = datetime.fromisoformat(cycle.replace('Z', '+00:00')).astimezone(kst)
          cycle_key = cycle_dt.strftime('%Y%m%d_%H%M')
          snapshot_dir = data / 'snapshots' / cycle_key
          snapshot_dir.mkdir(parents=True, exist_ok=True)

          for name in (
              'latest_scan.csv',
              'latest_dual_scan_v5.csv',
              'latest_microstructure.csv',
              'latest_extended_summary.json',
          ):
              src = data / name
              if src.exists():
                  shutil.copy2(src, snapshot_dir / name)

          marker = {
              'status': 'complete',
              'strict_complete': partial_count == 0,
              'scan_cycle': cycle,
              'scan_cycle_kst': cycle_dt.isoformat(),
              'scan_run_id': run_id,
              'snapshot_path': str(snapshot_dir).replace('\\', '/'),
              'market_count': len(base_markets),
              'v5_evaluated': len(v5),
              'microstructure_count': len(micro_markets),
              'trade_coverage_threshold': MIN_TRADE_COVERAGE,
              'trade_complete_count': complete_count,
              'trade_partial_count': partial_count,
              'trade_coverage_ratio': round(coverage_ratio, 6),
              'completed_at_utc': datetime.now(timezone.utc).isoformat(),
          }
          (data / 'latest_complete_cycle.json').write_text(
              json.dumps(marker, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          root = data / 'snapshots'
          dirs = sorted([p for p in root.iterdir() if p.is_dir()], key=lambda p: p.name, reverse=True)
          for old in dirs[12:]:
              shutil.rmtree(old)
          PY
      - name: Commit latest results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/latest_scan.json data/latest_scan.csv
          git add data/latest_dual_scan_v5.csv data/latest_ma120_backtest_v4.csv data/latest_extended_summary.json
          git add data/latest_microstructure.json data/latest_microstructure.csv
          git add data/microstructure_history.json data/signal_event_history.jsonl
          git add data/surge_case_db.json
          git add data/latest_learning_model.json data/latest_learning_predictions.json data/latest_intraday_transitions.json
          git add data/latest_complete_cycle.json data/snapshots
          git diff --cached --quiet || git commit -m "Update Upbit scan with completed cycle snapshot"
          git push
