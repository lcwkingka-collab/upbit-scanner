<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upbit Dual Early Warning Scanner v5</title><style>body{font-family:system-ui,sans-serif;margin:16px;line-height:1.45}button{font-size:18px;padding:14px 18px;border-radius:10px}#s{white-space:pre-wrap;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:11px;margin:10px 0 22px}th,td{border:1px solid #ccc;padding:5px;text-align:right}th:first-child,td:first-child{text-align:left}.note{font-size:13px;color:#555}.box{padding:12px;border:1px solid #bbb;border-radius:10px;margin:12px 0}.hot{font-weight:700}</style></head><body>
<h2>업비트 KRW 이중 조기경보 스캐너 v5</h2>
<p><b>A형 = 교차 선행형</b> (MA50/MA120 D-1~7) · <b>B형 = 발사대형</b> (골든 이후 아직 과도하게 뻗지 않았고 MA120 공격/추세가속)</p>
<p class="note">B형은 T(Threshold) 같은 누락을 줄이기 위한 별도 필터입니다. 거래대금 급증은 필수조건이 아니라 가산점입니다. 예상일은 최근 5거래일 MA 간격의 선형 수렴 추정치입니다.</p>
<button id="run">전체 스캔 + CSV 저장</button><div id="s">대기 중</div><div id="out"></div>
<script>
const API='https://api.upbit.com/v1';const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function avg(a,n,end=a.length){const x=a.slice(end-n,end);return x.reduce((s,v)=>s+v,0)/n}function esc(v){return '"'+String(v??'').replaceAll('"','""')+'"'}async function getJson(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status+' '+url);return r.json()}function maAt(a,n,end){return avg(a,n,end)}function signedGap(s,l){return(l-s)/l*100}function linSlope(v){const n=v.length,mx=(n-1)/2,my=v.reduce((a,b)=>a+b,0)/n;let num=0,den=0;for(let i=0;i<n;i++){num+=(i-mx)*(v[i]-my);den+=(i-mx)*(i-mx)}return num/den}function forecast(g,side){const x=g[g.length-1],sl=linSlope(g);if(side==='up'){if(!(x>0&&sl<0))return null;const d=x/(-sl);return d>0&&d<=7.5?d:null}if(!(x<0&&sl>0))return null;const d=(-x)/sl;return d>0&&d<=7.5?d:null}function bucket(d){if(d==null)return'';if(d<=2)return'D-1~2';if(d<=4)return'D-3~4';return'D-5~7'}
function launchScore(x){let s=0;if(x.ma15>x.ma50)s+=2;if(x.ma50<x.ma120)s+=2;if(x.slope15>0.4)s+=1;if(x.slope15>1)s+=1;if(x.gap120>0&&x.gap120<=8)s+=2;else if(x.gap120>8&&x.gap120<=15)s+=1;if(x.conv120<0)s+=2;if(x.f120up!=null)s+=2;if(x.volAccel>20)s+=1;if(x.volAccel>80)s+=1;if(x.ret5>-3&&x.ret5<12)s+=1;if(x.ret5>=18)s-=2;return s}
function grade(s){return s>=10?'A급':s>=7?'B급':s>=5?'관찰':'-'}
async function run(){const st=document.querySelector('#s'),out=document.querySelector('#out'),btn=document.querySelector('#run');out.innerHTML='';btn.disabled=true;try{st.textContent='KRW 종목 목록 수집 중...';const markets=(await getJson(API+'/market/all?isDetails=false')).filter(x=>x.market.startsWith('KRW-'));const rows=[];for(let i=0;i<markets.length;i++){const m=markets[i];st.textContent=`일봉 수집/계산 중 ${i+1}/${markets.length} : ${m.market}`;try{let c=await getJson(API+'/candles/days?market='+encodeURIComponent(m.market)+'&count=140');c=c.reverse();const close=c.map(x=>x.trade_price),vol=c.map(x=>x.candle_acc_trade_price);if(close.length<127)continue;const n=close.length,ma15=maAt(close,15,n),ma50=maAt(close,50,n),ma120=maAt(close,120,n),p15=maAt(close,15,n-1),p50=maAt(close,50,n-1),p120=maAt(close,120,n-1);const slope15=(ma15-p15)/p15*100,g50=[],g120=[];for(let k=4;k>=0;k--){const e=n-k;g50.push(signedGap(maAt(close,15,e),maAt(close,50,e)));g120.push(signedGap(maAt(close,15,e),maAt(close,120,e)))}const gap50=g50[4],gap120=g120[4],conv50=linSlope(g50),conv120=linSlope(g120),f50up=forecast(g50,'up'),f50down=forecast(g50,'down'),f120up=forecast(g120,'up'),f120down=forecast(g120,'down');const goldenNow=p15<=p50&&ma15>ma50,deadNow=p15>=p50&&ma15<ma50,up120Now=p15<=p120&&ma15>ma120,down120Now=p15>=p120&&ma15<ma120;const v5=avg(vol,5,n),vPrev=avg(vol,5,n-5),volAccel=vPrev?((v5/vPrev)-1)*100:0,ret5=(close[n-1]/close[n-6]-1)*100;let x={market:m.market,name:m.korean_name,price:close[n-1],ma15,ma50,ma120,slope15,gap50,gap120,conv50,conv120,f50up,f50down,f120up,f120down,goldenNow,deadNow,up120Now,down120Now,volAccel,ret5};x.launchScore=launchScore(x);x.launchGrade=grade(x.launchScore);rows.push(x)}catch(e){console.log(m.market,e)}await sleep(115)}
const cnt=rows.length,above50=rows.filter(x=>x.ma15>x.ma50).length,above120=rows.filter(x=>x.ma15>x.ma120).length,upSlope=rows.filter(x=>x.slope15>0).length,gold7=rows.filter(x=>x.f50up!=null).length,dead7=rows.filter(x=>x.f50down!=null).length,goldNow=rows.filter(x=>x.goldenNow).length,deadNow=rows.filter(x=>x.deadNow).length,btc=rows.find(x=>x.market==='KRW-BTC');const p50=above50/cnt*100,p120=above120/cnt*100,pUp=upSlope/cnt*100;let sc=0;if(p50>=60)sc+=2;else if(p50>=50)sc++;else if(p50<40)sc-=2;else sc--;if(p120>=55)sc+=2;else if(p120>=45)sc++;else if(p120<35)sc-=2;else sc--;if(pUp>=60)sc+=2;else if(pUp>=50)sc++;else if(pUp<40)sc-=2;else if(pUp<50)sc--;if(gold7>dead7*1.25)sc+=2;else if(dead7>gold7*1.25)sc-=2;if(btc){sc+=btc.ma15>btc.ma50?1:-1;sc+=btc.ma50>btc.ma120?1:-1;sc+=btc.slope15>0?1:-1}const regime=sc>=6?'🟢 상승장':sc>=3?'🔵 상승 전환 징후':sc>=-2?'🟡 안정·횡보':sc>=-5?'🟠 하락 전환 징후':'🔴 하락장';
const A50=rows.filter(x=>x.f50up!=null).sort((a,b)=>a.f50up-b.f50up),A120=rows.filter(x=>x.f120up!=null).sort((a,b)=>a.f120up-b.f120up),B=rows.filter(x=>x.launchScore>=5).sort((a,b)=>b.launchScore-a.launchScore||a.gap120-b.gap120),D=rows.filter(x=>x.f50down!=null||x.f120down!=null).sort((a,b)=>(a.f50down??a.f120down)-(b.f50down??b.f120down));
const header=['구분','등급','예상구간','예상일수','마켓','한글명','현재가','MA15','MA50','MA120','MA15기울기%','MA15-MA50부호간격%','MA15-MA120부호간격%','MA50수렴속도','MA120수렴속도','최근5일거래대금증감%','최근5일가격변화%','발사점수'];const lines=[header.map(esc).join(',')];lines.push(['시장요약',regime,'','',`계산 ${cnt}/${markets.length}`,`MA15>50 ${p50.toFixed(1)}% / MA15>120 ${p120.toFixed(1)}% / MA15상승 ${pUp.toFixed(1)}%`,`골든D7 ${gold7} / 데드D7 ${dead7}`,`오늘골든 ${goldNow} / 오늘데드 ${deadNow}`,btc?`BTC 15>50:${btc.ma15>btc.ma50} 50>120:${btc.ma50>btc.ma120} 15기울기:${btc.slope15.toFixed(3)}%`:'BTC없음','','','','','','','','',''].map(esc).join(','));function add(label,arr,key){for(const x of arr){const d=key?x[key]:null;lines.push([label,x.launchGrade,bucket(d),d==null?'':d.toFixed(2),x.market,x.name,x.price,x.ma15,x.ma50,x.ma120,x.slope15,x.gap50,x.gap120,x.conv50,x.conv120,x.volAccel,x.ret5,x.launchScore].map(esc).join(','))}}add('A형_MA50선행',A50,'f50up');add('A형_MA120선행',A120,'f120up');add('B형_발사조기경보',B,null);add('위험_데드선행',D,null);const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date(),local=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;a.download='upbit_dual_scan_v5_'+local+'.csv';a.click();
function tbl(title,arr,key){return `<h3>${title} (${arr.length})</h3><table><tr><th>종목</th><th>등급</th><th>예상</th><th>MA15기울기</th><th>MA120간격</th><th>거래대금5일</th><th>가격5일</th><th>점수</th></tr>`+arr.slice(0,35).map(x=>{const d=key?x[key]:null;return `<tr class="${x.launchGrade==='A급'?'hot':''}"><td>${x.name} (${x.market.slice(4)})</td><td>${x.launchGrade}</td><td>${d==null?'':bucket(d)+' '+d.toFixed(1)+'일'}</td><td>${x.slope15.toFixed(2)}%</td><td>${x.gap120.toFixed(2)}%</td><td>${x.volAccel.toFixed(1)}%</td><td>${x.ret5.toFixed(1)}%</td><td>${x.launchScore}</td></tr>`}).join('')+'</table>'}out.innerHTML=`<div class="box"><b>시장 국면: ${regime}</b><br>계산 ${cnt}/${markets.length} · MA15&gt;50 ${p50.toFixed(1)}% · MA15&gt;120 ${p120.toFixed(1)}% · MA15상승 ${pUp.toFixed(1)}%<br>골든 D7 ${gold7} / 데드 D7 ${dead7} · 오늘 골든 ${goldNow} / 데드 ${deadNow}</div>`+tbl('① A형: MA50 교차 선행',A50,'f50up')+tbl('① A형: MA120 교차 선행',A120,'f120up')+tbl('② B형: T형 발사 조기경보',B,null)+tbl('⚠ 데드 선행',D,null);st.textContent=`완료: ${rows.length}/${markets.length}. v5 CSV 저장 완료.`}catch(e){st.textContent='오류: '+e.message+'\n크롬에서 인터넷 연결을 확인하세요.'}finally{btn.disabled=false}}document.querySelector('#run').onclick=run;
</script></body></html>
